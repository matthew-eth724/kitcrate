<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">kitcrate</title>
  <desc id="desc">collections for agent skills</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="15.5" fill="none" stroke="url(#edge)" stroke-opacity="0.35"/>

  <!-- a crate, drawn in the terminal accent colours -->
  <g transform="translate(96 150)">
    <polygon points="-58,-38 0,-70 58,-38 0,-6" fill="#58a6ff" fill-opacity="0.9"/>
    <polygon points="0,-6 58,-38 58,38 0,70" fill="#a371f7" fill-opacity="0.85"/>
    <polygon points="-58,-38 0,-6 0,70 -58,38" fill="#3fb950" fill-opacity="0.75"/>
    <polygon points="-58,-38 0,-70 58,-38 58,38 0,70 -58,38" fill="none" stroke="#e6edf3" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -58 -38 L 0 -6 L 58 -38" fill="none" stroke="#e6edf3" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M 0 -6 L 0 70" fill="none" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <text x="196" y="132" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">kitcrate</text>
  <text x="200" y="178" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" fill="#8b949e" letter-spacing="1">collections for agent skills</text>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#58a6ff">
    <text x="200" y="222" text-anchor="start">$</text>
    <text x="218" y="222" fill="#3fb950" text-anchor="start">kitcrate add</text>
    <text x="342" y="222" fill="#e6edf3" text-anchor="start">acme/web-security</text>
    <rect x="512" y="210" width="11" height="17" fill="#8b949e" opacity="0.75"/>
  </g>
</svg>
